name: Deploy to Stage

# Nothing secret is passed as a repository variable: variables are not masked
# in Actions logs, and this repository is public.
on:
  push:
    branches:
      - main
      # Push a branch as stage/<name> to deploy it to the Stage workspace
      # and test it before it merges.
      - "stage/**"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Stage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm ci
        run: npm ci
      - name: Setup CLI
        uses: adobe/aio-cli-setup-action@1.3.0
        with:
          os: ubuntu-latest
          version: 10.x.x
      - name: Auth
        uses: adobe/aio-apps-action@3.3.0
        with:
          os: ubuntu-latest
          command: oauth_sts
          CLIENTID: ${{ vars.CLIENTID_STAGE }}
          CLIENTSECRET: ${{ secrets.CLIENTSECRET_STAGE }}
          TECHNICALACCOUNTID: ${{ vars.TECHNICALACCID_STAGE }}
          TECHNICALACCOUNTEMAIL: ${{ vars.TECHNICALACCEMAIL_STAGE }}
          IMSORGID: ${{ vars.IMSORGID_STAGE }}
          SCOPES: ${{ vars.SCOPES_STAGE }}
      - name: IMS scopes as a JSON array (lib-auth does not split commas)
        env:
          SCOPES: ${{ vars.SCOPES_STAGE }}
        run: echo "AIO_COMMERCE_AUTH_IMS_SCOPES=$(jq -cn --arg s "$SCOPES" '$s | split(",") | map(gsub("^\\s+|\\s+$"; ""))')" >> "$GITHUB_ENV"
      - name: Build
        env:
          AIO_RUNTIME_NAMESPACE: ${{ vars.AIO_RUNTIME_NAMESPACE_STAGE }}
          COMMERCE_WEBHOOKS_PUBLIC_KEY: ${{ vars.COMMERCE_WEBHOOKS_PUBLIC_KEY_STAGE }}
          AIO_COMMERCE_CONFIG_ENCRYPTION_KEY: ${{ secrets.AIO_COMMERCE_CONFIG_ENCRYPTION_KEY }}
          # The workspace's OAuth server-to-server credential, which the
          # App Management installation step uses to create the carrier.
          AIO_COMMERCE_AUTH_IMS_CLIENT_ID: ${{ vars.CLIENTID_STAGE }}
          AIO_COMMERCE_AUTH_IMS_CLIENT_SECRETS: '["${{ secrets.CLIENTSECRET_STAGE }}"]'
          AIO_COMMERCE_AUTH_IMS_TECHNICAL_ACCOUNT_ID: ${{ vars.TECHNICALACCID_STAGE }}
          AIO_COMMERCE_AUTH_IMS_TECHNICAL_ACCOUNT_EMAIL: ${{ vars.TECHNICALACCEMAIL_STAGE }}
          AIO_COMMERCE_AUTH_IMS_ORG_ID: ${{ vars.IMSORGID_STAGE }}
        uses: adobe/aio-apps-action@3.3.0
        with:
          os: ubuntu-latest
          command: build
      - name: Deploy
        env:
          AIO_RUNTIME_NAMESPACE: ${{ vars.AIO_RUNTIME_NAMESPACE_STAGE }}
          COMMERCE_WEBHOOKS_PUBLIC_KEY: ${{ vars.COMMERCE_WEBHOOKS_PUBLIC_KEY_STAGE }}
          AIO_COMMERCE_CONFIG_ENCRYPTION_KEY: ${{ secrets.AIO_COMMERCE_CONFIG_ENCRYPTION_KEY }}
          # The workspace's OAuth server-to-server credential, which the
          # App Management installation step uses to create the carrier.
          AIO_COMMERCE_AUTH_IMS_CLIENT_ID: ${{ vars.CLIENTID_STAGE }}
          AIO_COMMERCE_AUTH_IMS_CLIENT_SECRETS: '["${{ secrets.CLIENTSECRET_STAGE }}"]'
          AIO_COMMERCE_AUTH_IMS_TECHNICAL_ACCOUNT_ID: ${{ vars.TECHNICALACCID_STAGE }}
          AIO_COMMERCE_AUTH_IMS_TECHNICAL_ACCOUNT_EMAIL: ${{ vars.TECHNICALACCEMAIL_STAGE }}
          AIO_COMMERCE_AUTH_IMS_ORG_ID: ${{ vars.IMSORGID_STAGE }}
          AIO_RUNTIME_AUTH: ${{ secrets.AIO_RUNTIME_AUTH_STAGE }}
          AIO_PROJECT_ID: ${{ vars.AIO_PROJECT_ID_STAGE }}
          AIO_PROJECT_NAME: ${{ vars.AIO_PROJECT_NAME_STAGE }}
          AIO_PROJECT_ORG_ID: ${{ vars.AIO_PROJECT_ORG_ID_STAGE }}
          AIO_PROJECT_WORKSPACE_ID: ${{ vars.AIO_PROJECT_WORKSPACE_ID_STAGE }}
          AIO_PROJECT_WORKSPACE_NAME: ${{ vars.AIO_PROJECT_WORKSPACE_NAME_STAGE }}
          AIO_PROJECT_WORKSPACE_DETAILS_SERVICES: ${{ vars.AIO_PROJECT_WORKSPACE_DETAILS_SERVICES_STAGE }}
        uses: adobe/aio-apps-action@3.3.0
        with:
          os: ubuntu-latest
          command: deploy
