name: Deploy to Prod

# Nothing secret is passed as a repository variable: variables are not masked
# in Actions logs, and this repository is public.
on:
  # Promoting a pre-release to a full release is the prod gate.
  release:
    types: [released]

jobs:
  deploy:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm ci
        run: npm ci
      - name: Setup CLI
        uses: adobe/aio-cli-setup-action@1.3.0
        with:
          os: ubuntu-latest
          version: 10.x.x
      - name: Auth
        uses: adobe/aio-apps-action@3.3.0
        with:
          os: ubuntu-latest
          command: oauth_sts
          CLIENTID: ${{ vars.CLIENTID_PROD }}
          CLIENTSECRET: ${{ secrets.CLIENTSECRET_PROD }}
          TECHNICALACCOUNTID: ${{ vars.TECHNICALACCID_PROD }}
          TECHNICALACCOUNTEMAIL: ${{ vars.TECHNICALACCEMAIL_PROD }}
          IMSORGID: ${{ vars.IMSORGID_PROD }}
          SCOPES: ${{ vars.SCOPES_PROD }}
      - name: IMS scopes as a JSON array (lib-auth does not split commas)
        env:
          SCOPES: ${{ vars.SCOPES_PROD }}
        run: echo "AIO_COMMERCE_AUTH_IMS_SCOPES=$(jq -cn --arg s "$SCOPES" '$s | split(",") | map(gsub("^\\s+|\\s+$"; ""))')" >> "$GITHUB_ENV"
      - name: Build
        env:
          AIO_RUNTIME_NAMESPACE: ${{ vars.AIO_RUNTIME_NAMESPACE_PROD }}
          COMMERCE_WEBHOOKS_PUBLIC_KEY: ${{ vars.COMMERCE_WEBHOOKS_PUBLIC_KEY_PROD }}
          AIO_COMMERCE_CONFIG_ENCRYPTION_KEY: ${{ secrets.AIO_COMMERCE_CONFIG_ENCRYPTION_KEY }}
          # The workspace's OAuth server-to-server credential, which the
          # App Management installation step uses to create the carrier.
          AIO_COMMERCE_AUTH_IMS_CLIENT_ID: ${{ vars.CLIENTID_PROD }}
          AIO_COMMERCE_AUTH_IMS_CLIENT_SECRETS: '["${{ secrets.CLIENTSECRET_PROD }}"]'
          AIO_COMMERCE_AUTH_IMS_TECHNICAL_ACCOUNT_ID: ${{ vars.TECHNICALACCID_PROD }}
          AIO_COMMERCE_AUTH_IMS_TECHNICAL_ACCOUNT_EMAIL: ${{ vars.TECHNICALACCEMAIL_PROD }}
          AIO_COMMERCE_AUTH_IMS_ORG_ID: ${{ vars.IMSORGID_PROD }}
        uses: adobe/aio-apps-action@3.3.0
        with:
          os: ubuntu-latest
          command: build
      - name: Deploy
        env:
          AIO_RUNTIME_NAMESPACE: ${{ vars.AIO_RUNTIME_NAMESPACE_PROD }}
          COMMERCE_WEBHOOKS_PUBLIC_KEY: ${{ vars.COMMERCE_WEBHOOKS_PUBLIC_KEY_PROD }}
          AIO_COMMERCE_CONFIG_ENCRYPTION_KEY: ${{ secrets.AIO_COMMERCE_CONFIG_ENCRYPTION_KEY }}
          # The workspace's OAuth server-to-server credential, which the
          # App Management installation step uses to create the carrier.
          AIO_COMMERCE_AUTH_IMS_CLIENT_ID: ${{ vars.CLIENTID_PROD }}
          AIO_COMMERCE_AUTH_IMS_CLIENT_SECRETS: '["${{ secrets.CLIENTSECRET_PROD }}"]'
          AIO_COMMERCE_AUTH_IMS_TECHNICAL_ACCOUNT_ID: ${{ vars.TECHNICALACCID_PROD }}
          AIO_COMMERCE_AUTH_IMS_TECHNICAL_ACCOUNT_EMAIL: ${{ vars.TECHNICALACCEMAIL_PROD }}
          AIO_COMMERCE_AUTH_IMS_ORG_ID: ${{ vars.IMSORGID_PROD }}
          AIO_RUNTIME_AUTH: ${{ secrets.AIO_RUNTIME_AUTH_PROD }}
          AIO_PROJECT_ID: ${{ vars.AIO_PROJECT_ID_PROD }}
          AIO_PROJECT_NAME: ${{ vars.AIO_PROJECT_NAME_PROD }}
          AIO_PROJECT_ORG_ID: ${{ vars.AIO_PROJECT_ORG_ID_PROD }}
          AIO_PROJECT_WORKSPACE_ID: ${{ vars.AIO_PROJECT_WORKSPACE_ID_PROD }}
          AIO_PROJECT_WORKSPACE_NAME: ${{ vars.AIO_PROJECT_WORKSPACE_NAME_PROD }}
          AIO_PROJECT_WORKSPACE_DETAILS_SERVICES: ${{ vars.AIO_PROJECT_WORKSPACE_DETAILS_SERVICES_PROD }}
        uses: adobe/aio-apps-action@3.3.0
        with:
          os: ubuntu-latest
          command: deploy
